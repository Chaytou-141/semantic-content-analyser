name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - name: Install browser for offline UI tests
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: node --check web/app.js
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t semantic-ci .
      - name: Start and health-check the image
        shell: bash
        run: |
          docker run -d --name semantic-ci -p 127.0.0.1:8000:8000 semantic-ci
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then ready=true; break; fi
            sleep 3
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8000/api/meta
          curl --fail --silent -H 'Content-Type: application/json' -H 'X-Workspace-Request: true' \
            -d '{"query":"choosing a display fridge","method":"compare","top_k":3}' \
            http://127.0.0.1:8000/api/search
      - name: Container logs
        if: failure()
        run: docker logs semantic-ci
      - name: Stop container
        if: always()
        run: docker rm -f semantic-ci || true
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
        working-directory: infra/aws
      - run: terraform init -backend=false
        working-directory: infra/aws
      - run: terraform validate
        working-directory: infra/aws
