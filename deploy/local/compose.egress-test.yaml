# Disposable offline targets only. Merge after production Compose; never deploy.
services:
  egress:
    pull_policy: never
    restart: "no"
    environment:
      INGRESS_TLS_PORT: "8443"
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:8443"
    networks:
      demo: {}
      local_ingress: {}
      simulated_public:
        ipv4_address: 11.203.24.2
        ipv6_address: 2001:4860:ffff:4d::2
      simulated_metadata:
        ipv4_address: 169.254.169.250
  app:
    pull_policy: never
    restart: "no"
    environment:
      # Network/operations tests do not need model loading or inference.
      PRELOAD_MODEL: "false"
      SSL_CERT_FILE: /fixtures/ca.crt
    volumes:
      - ${FIXTURE_DIR:?Set FIXTURE_DIR}:/fixtures:ro
  proxy:
    pull_policy: never
    restart: "no"
    environment:
      DOMAIN: localhost:8443
    healthcheck:
      test: [CMD, wget, -q, --spider, --no-check-certificate, "https://localhost:8443/health"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 5
  fixture:
    image: ${EGRESS_IMAGE}
    command: [python, /fixtures/server.py]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${FIXTURE_DIR}:/fixtures:ro
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',80,timeout=1); c.request('GET','/robots.txt'); assert c.getresponse().status==200"]
      interval: 2s
      timeout: 3s
      retries: 5
    networks:
      demo:
        ipv4_address: 172.30.42.4
        ipv6_address: fd00:4d::4
      simulated_public:
        ipv4_address: 11.203.24.3
        ipv6_address: 2001:4860:ffff:4d::3
        aliases: [public.fixture.invalid]
      simulated_metadata:
        ipv4_address: 169.254.169.254
networks:
  demo:
    internal: true
    enable_ipv6: true
    ipam:
      config: !override
        - subnet: 172.30.42.0/29
        - subnet: fd00:4d::/64
  local_ingress: {}
  # Public-classified IPs routed ONLY to this internal Docker bridge. They are
  # controlled fixtures, never requests to the real holders of these addresses.
  simulated_public:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 11.203.24.0/29
        - subnet: 2001:4860:ffff:4d::/64
  simulated_metadata:
    internal: true
    ipam:
      config:
        - subnet: 169.254.169.248/29
